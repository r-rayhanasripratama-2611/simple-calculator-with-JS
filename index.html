<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
  </head>
  <div class="container">
    <div class="text-center">
      <h1>Kalkulator</h1>
    </div>
    <div class="row justify-content-center mt-3">
      <div class="col-3">
        <div class="input-group">
          <input
            type="text"
            id="angkapertama"
            class="form-control"
            placeholder="angka pertama" />
        </div>
      </div>
      <div class="col-3">
        <div class="input-group">
          <input
            type="text"
            id="angkakedua"
            class="form-control"
            placeholder="angka kedua" />
        </div>
      </div>
      <div class="row justify-content-center mt-3 gap-3">
        <button type="button" class="btn btn-primary col-1" id="jumlahkan">
          +
        </button>
        <button type="button" class="btn btn-primary col-1" id="kurangkan">
          -
        </button>
        <button type="button" class="btn btn-primary col-1" id="kali">x</button>
        <button type="button" class="btn btn-primary col-1" id="bagi">/</button>
      </div>
      <div class="text-center mt-3">
        <span id="hasilnya">Hasil</span>
      </div>
    </div>
  </div>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
